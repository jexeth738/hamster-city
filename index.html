.ol input:focus { border-color: #ffd166; }
.ol .err { min-height: 22px; margin: 4px 0; color: #ff7b7b; text-align: center; } .ol .err.wait { color: #9fb6d9; }
.ol button { font: 11px/1.2 "Press Start 2P", monospace; color: #fff; background: #0a0f22; border: 2px solid #6ad7ff; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.ol button:hover, .ol button.on { border-color: #ffd166; color: #ffd166; } .ol button.main { border-color: #7dff9a; color: #7dff9a; } .ol button:disabled { opacity: 0.5; }

.ol .x { position: absolute; top: 6px; right: 6px; color: #ff7b7b; border-color: transparent; background: none; font-size: 15px; padding: 6px 8px; }
.ol .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; } .ol .tabs button { flex: 1; padding: 9px 4px; font-size: 9px; }

<script>
function goFull() {
  const d = document.documentElement; const rq = d.requestFullscreen || d.webkitRequestFullscreen;
  if (rq) { try { const p = rq.call(d, { navigationUI: 'hide' }); const lock = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }; if (p && p.then) p.then(lock).catch(() => {}); else lock(); } catch (e) {} }
}
window.goFull = goFull;
document.getElementById('fsBtn').onclick = goFull;
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) document.getElementById('fsBtn').style.display = 'none';
document.getElementById('anyway').onclick = () => document.body.classList.add('portrait-ok');
</script>
